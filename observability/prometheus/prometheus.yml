global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: diddifree-id
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/diddifree-metrics-token
    static_configs:
      - targets:
          - app:8000
