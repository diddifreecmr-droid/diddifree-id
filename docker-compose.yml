services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Inside the compose network the services resolve by name, so these
      # override whatever localhost values .env carries for host-side work.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/diddi_free_id
      REDIS_URL: redis://redis:6379/0
      APP_HOST_PORT: ${APP_HOST_PORT:-18000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HEALTH_CHECK_TIMEOUT_SECONDS: ${HEALTH_CHECK_TIMEOUT_SECONDS:-2}
    ports:
      - "${APP_HOST_PORT:-18000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Source mount for live reload in development. Remove for production
      # images - the code is already baked into the layer.
      - ./identity_app:/app/identity_app
      - ./alembic:/app/alembic
      # Dev signing keys. In production these come from the secrets vault and
      # are never part of the image or a bind mount (architecture section 9.1).
      - ./keys:/app/keys:ro
    command: >
      sh -c "alembic upgrade head &&
      uvicorn identity_app.main:app --host 0.0.0.0 --port 8000 --reload"
    labels:
      com.diddifree.observability: "true"

  db:
    # No PostGIS here, unlike DiddiGo - DiddiFreeID stores no geometry.
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diddi_free_id
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    # Host port is configurable and intentionally kept away from the usual
    # ecosystem defaults. Portainer can override DB_HOST_PORT for this stack.
    ports:
      - "${DB_HOST_PORT:-15438}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diddi_free_id"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      com.diddifree.observability: "true"

  redis:
    image: redis:7-alpine
    # Host port is configurable for the same coexistence reason as Postgres.
    ports:
      - "${REDIS_HOST_PORT:-16391}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      com.diddifree.observability: "true"

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "${PROMETHEUS_HOST_PORT:-19090}:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    labels:
      com.diddifree.observability: "true"

  loki:
    image: grafana/loki:3.3.2
    ports:
      - "${LOKI_HOST_PORT:-13100}:3100"
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - loki_data:/loki
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    labels:
      com.diddifree.observability: "true"

  alloy:
    image: grafana/alloy:v1.8.3
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy"]
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
    labels:
      com.diddifree.observability: "true"

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "${GRAFANA_HOST_PORT:-13000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-in-portainer}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    labels:
      com.diddifree.observability: "true"

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
