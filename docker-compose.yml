services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Inside the compose network the services resolve by name, so these
      # override whatever localhost values .env carries for host-side work.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/diddi_free_id
      REDIS_URL: redis://redis:6379/0
      APP_HOST_PORT: ${APP_HOST_PORT:-18000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HEALTH_CHECK_TIMEOUT_SECONDS: ${HEALTH_CHECK_TIMEOUT_SECONDS:-2}
      SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0}
      SERVICE_INSTANCE_ID: ${SERVICE_INSTANCE_ID:-}
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:-}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORT_TIMEOUT_SECONDS: ${OTEL_EXPORT_TIMEOUT_SECONDS:-3}
      OTEL_TRACE_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-0.1}
      WORKER_HEARTBEAT_STALE_SECONDS: ${WORKER_HEARTBEAT_STALE_SECONDS:-7200}
      WORKER_HEARTBEAT_TTL_SECONDS: ${WORKER_HEARTBEAT_TTL_SECONDS:-14400}
    ports:
      - "${APP_HOST_PORT:-18000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Source mount for live reload in development. Remove for production
      # images - the code is already baked into the layer.
      - ./identity_app:/app/identity_app
      - ./alembic:/app/alembic
      # Dev signing keys. In production these come from the secrets vault and
      # are never part of the image or a bind mount (architecture section 9.1).
      - ./keys:/app/keys:ro
    command: >
      sh -c "alembic upgrade head &&
      uvicorn identity_app.main:app --host 0.0.0.0 --port 8000 --reload"
    labels:
      com.diddifree.observability: "true"

  db:
    # No PostGIS here, unlike DiddiGo - DiddiFreeID stores no geometry.
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diddi_free_id
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    # Host port is configurable and intentionally kept away from the usual
    # ecosystem defaults. Portainer can override DB_HOST_PORT for this stack.
    ports:
      - "${DB_HOST_PORT:-15438}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diddi_free_id"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      com.diddifree.observability: "true"

  redis:
    image: redis:7-alpine
    # Host port is configurable for the same coexistence reason as Postgres.
    ports:
      - "${REDIS_HOST_PORT:-16391}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      com.diddifree.observability: "true"

  prometheus:
    build:
      context: ./observability
      dockerfile: Dockerfile
      target: prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-19090}:9090"
    environment:
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:-}
    volumes:
      - prometheus_data:/prometheus
    entrypoint: ["/bin/sh", "-ec"]
    command: >
      umask 077;
      printf '%s' "$$METRICS_AUTH_TOKEN" > /tmp/diddifree-metrics-token;
      exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    labels:
      com.diddifree.observability: "true"

  loki:
    build:
      context: ./observability
      dockerfile: Dockerfile
      target: loki
    ports:
      - "${LOKI_HOST_PORT:-13100}:3100"
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    labels:
      com.diddifree.observability: "true"

  alloy:
    build:
      context: ./observability
      dockerfile: Dockerfile
      target: alloy
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy"]
    depends_on:
      loki:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy
    labels:
      com.diddifree.observability: "true"

  grafana:
    build:
      context: ./observability
      dockerfile: Dockerfile
      target: grafana
    ports:
      - "${GRAFANA_HOST_PORT:-13000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-in-portainer}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    labels:
      com.diddifree.observability: "true"

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
