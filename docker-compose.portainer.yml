services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      APP_HOST_PORT: ${APP_HOST_PORT:-18000}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
      JWT_ACTIVE_KID: ${JWT_ACTIVE_KID}
      JWT_PREVIOUS_PUBLIC_KEY_PATH: ${JWT_PREVIOUS_PUBLIC_KEY_PATH:-}
      JWT_PREVIOUS_KID: ${JWT_PREVIOUS_KID:-}
      JWT_ISSUER: ${JWT_ISSUER:-diddifree-id}
      JWT_ACCESS_LIFETIME_MINUTES: ${JWT_ACCESS_LIFETIME_MINUTES:-15}
      REFRESH_TOKEN_LIFETIME_DAYS: ${REFRESH_TOKEN_LIFETIME_DAYS:-30}
      OTP_CODE_LIFETIME_SECONDS: ${OTP_CODE_LIFETIME_SECONDS:-300}
      OTP_RATE_LIMIT_SECONDS: ${OTP_RATE_LIMIT_SECONDS:-60}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_HASH_PEPPER: ${OTP_HASH_PEPPER}
      OTP_LOG_PLAINTEXT: ${OTP_LOG_PLAINTEXT:-false}
      SERVICE_API_KEYS: ${SERVICE_API_KEYS:-}
      API_PREFIX: ${API_PREFIX:-/identity/v1}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "${APP_HOST_PORT:-18000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./identity_app:/app/identity_app
      - ./alembic:/app/alembic
      - ./keys:/app/keys:ro
    command: >
      sh -c "alembic upgrade head &&
      uvicorn identity_app.main:app --host 0.0.0.0 --port 8000"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diddi_free_id
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${DB_HOST_PORT:-15435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diddi_free_id"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-16381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
