services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/diddi_free_id
      REDIS_URL: redis://redis:6379/0
      APP_HOST_PORT: ${APP_HOST_PORT:-18010}
      # The keys live in the persistent Docker volume mounted below.
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      JWT_ACTIVE_KID: ${JWT_ACTIVE_KID:-diddifree-initial}
      JWT_PREVIOUS_PUBLIC_KEY_PATH: ${JWT_PREVIOUS_PUBLIC_KEY_PATH:-}
      JWT_PREVIOUS_KID: ${JWT_PREVIOUS_KID:-}
      JWT_ISSUER: ${JWT_ISSUER:-diddifree-id}
      JWT_ACCESS_LIFETIME_MINUTES: ${JWT_ACCESS_LIFETIME_MINUTES:-15}
      REFRESH_TOKEN_LIFETIME_DAYS: ${REFRESH_TOKEN_LIFETIME_DAYS:-30}
      OTP_CODE_LIFETIME_SECONDS: ${OTP_CODE_LIFETIME_SECONDS:-300}
      OTP_RATE_LIMIT_SECONDS: ${OTP_RATE_LIMIT_SECONDS:-60}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_HASH_PEPPER: ${OTP_HASH_PEPPER}
      OTP_LOG_PLAINTEXT: ${OTP_LOG_PLAINTEXT:-true}
      OTP_PROVIDER: ${OTP_PROVIDER:-logging}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_POLL_TIMEOUT_SECONDS: ${TELEGRAM_POLL_TIMEOUT_SECONDS:-25}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-no-reply@diddifree.com}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-no-reply@diddifree.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-DiddiFreeID}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SERVICE_API_KEYS: ${SERVICE_API_KEYS:-}
      API_PREFIX: ${API_PREFIX:-/identity/v1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CORS_ALLOWED_ORIGIN_REGEX: ${CORS_ALLOWED_ORIGIN_REGEX:-^https?://(localhost|127[.]0[.]0[.]1)(:[0-9]+)?$}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "${APP_HOST_PORT:-18010}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - jwtkeys:/app/keys
    command:
      - sh
      - -c
      - |
        if [ ! -s /app/keys/private.pem ] || [ ! -s /app/keys/public.pem ]; then
          python scripts/generate_keys.py --out /app/keys --kid "${JWT_ACTIVE_KID:-diddifree-initial}"
        fi
        alembic upgrade head
        exec uvicorn identity_app.main:app --host 0.0.0.0 --port 8000

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diddi_free_id
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${DB_HOST_PORT:-15438}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diddi_free_id"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-16391}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  jwtkeys:
