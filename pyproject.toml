[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diddi-free-id"
version = "0.1.0"
description = "DiddiFreeID — service d'identité central de l'écosystème DiddiFree (FastAPI, CQRS léger, JWT RS256)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    # `[crypto]` pulls `cryptography`, which is what backs RS256 signing and
    # the JWKS export. Without it PyJWT can only do HMAC.
    "pyjwt[crypto]>=2.8",
    "cryptography>=42.0",
    # Argon2id for back-office passwords (architecture §8 — explicitly not bcrypt).
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "redis[hiredis]>=5.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["identity_app*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    # `Depends(...)` / `Query(...)` in defaults is the documented FastAPI
    # idiom, not the mutable-default bug this rule targets.
    "B008",
    # `str, Enum` is deliberate: it keeps `.value` implicit when these enums
    # are serialised into JSON responses and SQL parameters.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Alembic revisions are generated from `script.py.mako`; leave their import and
# annotation style alone rather than diverging from what `alembic revision`
# will write next time.
"alembic/versions/*" = ["E501", "I001", "UP007", "UP035"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
