[alembic]
# Path to migration scripts, relative to alembic.ini at the project root.
# `alembic/env.py` overrides the url below from `settings.database_url`, so
# this value is only a placeholder for tooling that reads the ini directly.
script_location = alembic
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5435/diddi_free_id

# Template for autogenerated migrations.
file_template = %%(year)d_%%(month).2d_%%(day).2d-%%(rev)s_%%(slug)s

# Timezone used when formatting the file_template timestamp.
# Defaults to UTC so the filename sorts cleanly regardless of dev machine locale.
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
